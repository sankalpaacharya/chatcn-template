services:
  postgres:
    image: postgres
    container_name: chatcn_postgres
    environment:
      POSTGRES_DB: chatcn
      POSTGRES_USER: chatcn
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatcn"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
